<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Padrão - HNRe</title>
    
    <!-- Importação da Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos globais de reset para e-mail */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        
        /* Classes auxiliares para responsividade */
        @media screen and (max-width: 600px) {
            .container { width: 100% !important; max-width: 100% !important; }
            .mobile-padding { padding: 20px !important; }
            .stack-column { display: block !important; width: 100% !important; margin-bottom: 15px !important; text-align: center !important; }
            .stack-column table { margin: 0 auto !important; }
            .hide-mobile { display: none !important; }
            .footer-text { text-align: center !important; padding-left: 0 !important; margin-top: 15px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f9; font-family: 'Montserrat', Arial, sans-serif; -webkit-font-smoothing: antialiased;">

    <center style="width: 100%; table-layout: fixed; background-color: #f4f6f9; padding: 40px 0;">
        <div style="max-width: 700px; margin: 0 auto; box-shadow: 0 4px 12px rgba(5, 15, 65, 0.08);">
            
            <!-- Tabela Principal -->
            <table align="center" border="0" cellspacing="0" cellpadding="0" width="100%" style="max-width: 700px; margin: auto; background-color: #ffffff; font-family: 'Montserrat', Arial, sans-serif; width: 100%; border-radius: 8px; overflow: hidden;">
                <tbody>
                    <!-- CABEÇALHO -->
                    <tr>
                        <td style="padding: 0px; text-align: center; background-color: #050F41; width: 100%;">
                            <img src="https://i.imgur.com/Btu1CAG.png" width="700" style="width: 100%; max-width: 700px; height: auto; display: block; border: 0px;" alt="Cabeçalho Hospital Naval de Recife - Junta Regular de Saúde" />
                        </td>
                    </tr>
                    
                    <!-- CORPO DO E-MAIL -->
                    <tr>
                        <td class="mobile-padding" style="background-color: #ffffff; padding: 40px 50px 20px 50px; text-align: left; font-size: 16px; line-height: 1.6; color: #050F41;">
                            
                            <p style="margin: 0 0 25px 0; font-weight: 600;">Prezado(a),</p>
                            
                            <!-- Área editável pelo usuário -->
                            <p style="margin: 0 0 25px 0;">[DIGITE O CONTEÚDO DO SEU E-MAIL AQUI]</p>
                            
                            <div style="height: 35px;"></div>

                            <!-- BLOCO DE ASSINATURA -->
                            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-top: 1px solid #e0e0e0; padding-top: 25px;">
                                <tbody>
                                    <tr>
                                        <td style="font-family: 'Montserrat', Arial, sans-serif; color: #050F41;">
                                            <p style="font-size: 15px; margin: 0 0 15px 0; font-weight: 600;">Respeitosamente,</p>
                                            
                                            <div style="font-size: 18px; font-weight: 700; color: #050F41; margin: 0 0 2px 0;">Mauriston Renan Martins Silva</div>
                                            <div style="font-size: 14px; line-height: 1.4; color: #555555;"><strong>Capitão-Tenente (Md)</strong><br />Presidente</div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                        </td>
                    </tr>
                    
                    <!-- RODAPÉ INSTITUCIONAL (Idêntico ao ajustado anteriormente) -->
                    <tr>
                        <td class="mobile-padding" style="background-color: #050F41; padding: 20px 50px; width: 100%;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%;">
                                <tbody>
                                    <tr>
                                        <!-- Logo (50%) -->
                                        <td class="stack-column" width="50%" align="center" valign="middle" style="padding-right: 15px;">
                                            <img src="https://i.imgur.com/v8L0kuH.png" width="260" style="width: 260px; max-width: 100%; height: auto; display: inline-block; border: 0px;" alt="Logo Marinha do Brasil" />
                                        </td>
                                        <!-- Divisor Desktop -->
                                        <td class="hide-mobile" width="1" style="border-left: 1px solid rgba(255,255,255,0.2); font-size: 1px; line-height: 1px;">&nbsp;</td>
                                        <!-- Informações (49%) -->
                                        <td class="stack-column footer-text" width="49%" align="left" valign="middle" style="padding-left: 20px; font-family: 'Montserrat', Arial, sans-serif; font-size: 11px; line-height: 1.4; color: #ffffff;">
                                            <strong style="color: #FAB932; font-size: 12px;">Hospital Naval de Recife</strong><br />
                                            Junta Regular de Saúde<br />
                                            📞 (81) 3036 - 9073 <span style="margin: 0 5px; color: rgba(255,255,255,0.4);">|</span> 📧 <a href="mailto:hnre.jrs@marinha.mil.br" style="color: #ffffff; text-decoration: underline;">hnre.jrs@marinha.mil.br</a><br />
                                            📍 Avenida Cruz Cabugá 1200, Santo Amaro, Recife/PE
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </tbody>
            </table>
            
        </div>
    </center>

</body>
</html>
